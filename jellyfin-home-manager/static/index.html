<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jellyfin Home Manager</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><h1>Jellyfin Home Manager</h1><p>One home-screen template, filtered safely for every user.</p></div><button id="refresh" class="secondary">Refresh libraries</button></header>
<main><div id="notice" role="status"></div><section><div class="sectionHead"><div><h2>Master library layout</h2><p>Drag libraries into order. Changes are not sent to Jellyfin until you preview and apply.</p></div><span id="discovery"></span></div><div id="libraries" class="libraries"></div></section>
<section><h2>Master settings</h2><p>These native Jellyfin user preferences are applied alongside the library layout.</p><div id="settings" class="settings"></div></section>
<section><div class="actions"><button id="save" class="secondary">Save template</button><button id="preview">Preview apply to all</button></div><div id="previewPanel"></div></section></main>
<template id="rowTemplate"><div class="lib" draggable="true"><span class="handle" title="Drag to reorder">⠿</span><div class="libName"><strong></strong><small></small></div><label><input type="checkbox" data-key="myMedia"> My Media</label><label><input type="checkbox" data-key="latest"> Latest</label></div></template>
<script src="app.js"></script></body></html>
