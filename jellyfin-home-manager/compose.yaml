services:
  jellyfin-home-manager:
    build:
      context: .
      dockerfile: Containerfile
    container_name: jellyfin-home-manager
    user: "10001:10001"
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      JELLYFIN_VERIFY_TLS: ${JELLYFIN_VERIFY_TLS:-true}
    ports:
      - "127.0.0.1:${JHM_PORT:-8080}:8080"
    volumes:
      - ./data:/data:Z
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
